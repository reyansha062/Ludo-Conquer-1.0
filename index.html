<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ludo Conquer — Web</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Ludo Conquer — Web (starter)</h1>
    <div class="controls">
      <button id="rollBtn">Roll Dice</button>
      <button id="endBtn">End Turn</button>
      <div id="dice">—</div>
      <div id="status"></div>
    </div>
    <canvas id="board" width="600" height="600"></canvas>
    <p class="notes">Pass-and-play demo. Click "Roll Dice", then click a token (home or on-board) to move if legal. Roll a 6 to enter the board.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
